name: Build & publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]     # tags created from the GitHub "New release" page
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      # 1. Build for amd64 and make sure the container actually starts and serves.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rxscan:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/data" && sudo chown root:root "$RUNNER_TEMP/data"
          docker run -d --name rxscan -p 8000:8000 -e MOCK_PARSER=true -v "$RUNNER_TEMP/data:/data" rxscan:test
          for i in $(seq 1 30); do curl -fs http://localhost:8000/healthz && break; sleep 1; done
          set -x
          curl -fs http://localhost:8000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/me)" = 401
          curl -fs -u admin:admin123 http://localhost:8000/api/me | grep -q '"vision"'
          curl -fs -u admin:admin123 http://localhost:8000/api/admin/users | grep -q '"users"'
          test -f "$RUNNER_TEMP/data/rxscan.db"                      # user database created
          curl -fs http://localhost:8000/login | grep -q 'Sign in'
          curl -fs http://localhost:8000/sw.js | grep -q 'rxscan-shell-'
          test "$(docker exec rxscan stat -c %u /proc/1)" = 1000    # app process dropped root
          test -f "$RUNNER_TEMP/data/session.key"                    # data dir made writable
      - name: Container logs
        if: always()
        run: docker logs rxscan || true

      # 2. Publish multi-arch image (not for pull requests).
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
