<!DOCTYPE html>
<html lang="en" class="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editing a prescription · RxScan 1.1 mockup</title>
<link rel="stylesheet" href="../rx.css">
</head><body>

<div class="app"><header class="topbar"><button class="iconbtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="brand">Review</span><span class="spacer"></span>
  <button class="iconbtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  <button class="avatar" aria-label="Your account">M</button></header>
  <article class="rx">
  <div class="rx-band"><b>Rx 0098817</b><span>Filled</span><span class="date">Nov 18, 2026</span></div>
  <div class="rx-body"><div class="fields">
      <div class="f full"><label>Medication</label><input value="Lisinopril"></div>
      <div class="f"><label>Strength</label><input value="10 mg"></div>
      <div class="f"><label>Form</label><input value="Tablet"></div>
      <div class="f"><label>Quantity</label><input value="30"></div>
      <div class="f"><label>Days supply</label><input value="30"></div>
      <div class="f"><label>Refills left</label><input value=""></div>
      <div class="f"><label>Date filled</label><input value="2026-11-18"></div>
      <div class="f full"><label>Prescriber</label><input value="Dr. Anika Patel"></div>
      <div class="f"><label>You paid</label><input value="4.00"></div>
      <div class="f"><label>Insurance paid</label><input class="blank" value="" placeholder="Not on receipt"></div>
      <div class="f full"><label>Notes</label><input class="blank" value="" placeholder="Not on receipt"></div>
    </div>
    <div class="rx-tools"><button>Done editing</button><button class="del">Remove</button></div></div></article>
</div>
<nav class="bar"><div class="in"><button class="btn btn-line">Add photos</button><button class="btn btn-primary">Add 2 to sheet</button></div></nav>
</body></html>
