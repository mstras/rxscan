<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RxScan">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<title>Sign in · RxScan</title>
<style>
  :root { --bg:#f5f5f2; --card:#fff; --ink:#1c1d1f; --muted:#6b6f76; --line:#e2e2dc; --accent:#0f766e; --accent-ink:#fff; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121314; --card:#1c1d1f; --ink:#ececea; --muted:#9a9ea5; --line:#2c2e31; --accent:#2dd4bf; --accent-ink:#062b27; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 20px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .brand img { width:48px; height:48px; border-radius:11px; }
  h1 { font-size:22px; margin:0; letter-spacing:-.01em; } .brand p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { width:100%; margin-top:18px; font:inherit; font-weight:650; border:0; border-radius:10px; padding:13px; background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  .err { color:var(--err); font-size:14px; margin-top:12px; min-height:1em; }
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <div class="brand"><img src="/static/icons/icon-192.png" alt=""><div><h1>RxScan</h1><p>Sign in to continue</p></div></div>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" name="next" id="next" value="/">
  <button type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("next")) document.getElementById("next").value = q.get("next");
  const msgs = { "1": "Wrong username or password.", "429": "Too many attempts. Try again in 15 minutes.", "out": "" };
  document.getElementById("err").textContent = msgs[q.get("e")] || "";
  document.getElementById(q.get("u") ? "password" : "username").focus();
  if (q.get("u")) document.getElementById("username").value = q.get("u");
</script>
</body>
</html>
